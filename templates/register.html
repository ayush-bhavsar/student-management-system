{% extends 'base.html' %}
{% block title %}Register - StudentMS{% endblock %}
{% block content %}
<div class="auth-card card shadow-sm mx-auto">
  <div class="card-body p-4">
    <h2 class="mb-3">Create Account</h2>
    <form method="post">
      <div class="mb-3"><label class="form-label">Username</label><input class="form-control" name="username" minlength="3" required></div>
      <div class="mb-3"><label class="form-label">Password</label><input class="form-control" type="password" name="password" minlength="6" required></div>
      <div class="mb-3"><label class="form-label">Confirm Password</label><input class="form-control" type="password" name="confirm_password" minlength="6" required></div>
      <button class="btn btn-primary w-100">Register</button>
    </form>
    <p class="mt-3 mb-0">Already registered? <a href="{{ url_for('auth.login') }}">Login</a></p>
  </div>
</div>
{% endblock %}
