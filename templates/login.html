{% extends 'base.html' %}
{% block title %}Login - StudentMS{% endblock %}
{% block content %}
<div class="auth-card card shadow-sm mx-auto">
  <div class="card-body p-4">
    <h2 class="mb-3">Login</h2>
    <p class="text-muted">Sign in to manage student records.</p>
    <form method="post">
      <div class="mb-3"><label class="form-label">Username</label><input class="form-control" name="username" required autofocus></div>
      <div class="mb-3"><label class="form-label">Password</label><input class="form-control" type="password" name="password" required></div>
      <button class="btn btn-primary w-100">Login</button>
    </form>
    <p class="mt-3 mb-0">No account? <a href="{{ url_for('auth.register') }}">Register</a></p>
  </div>
</div>
{% endblock %}
