{% extends 'base.html' %}
{% block title %}Add Student - StudentMS{% endblock %}
{% block content %}
<h1 class="mb-4">Add Student</h1>
<form method="post" class="card shadow-sm"><div class="card-body"><div class="row g-3">
<div class="col-md-6"><label class="form-label">Roll Number *</label><input class="form-control" name="roll_number" value="{{ student.get('roll_number', '') }}" required></div>
<div class="col-md-6"><label class="form-label">Full Name *</label><input class="form-control" name="name" value="{{ student.get('name', '') }}" required></div>
<div class="col-md-6"><label class="form-label">Email *</label><input class="form-control" type="email" name="email" value="{{ student.get('email', '') }}" required></div>
<div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" name="phone" value="{{ student.get('phone', '') }}"></div>
<div class="col-md-6"><label class="form-label">Course *</label><input class="form-control" name="course" value="{{ student.get('course', '') }}" required></div>
<div class="col-md-6"><label class="form-label">Semester *</label><input class="form-control" type="number" name="semester" min="1" max="12" value="{{ student.get('semester', '') }}" required></div>
<div class="col-md-6"><label class="form-label">City</label><input class="form-control" name="city" value="{{ student.get('city', '') }}"></div>
</div><div class="mt-4"><button class="btn btn-primary">Save Student</button> <a class="btn btn-secondary" href="{{ url_for('students.list_students') }}">Cancel</a></div></div></form>
{% endblock %}
